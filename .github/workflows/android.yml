name: Build Android APK

on:
  push:
    branches: [feat/android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless zip unzip

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK
        env:
          BUILD_FAILED: '0'
        run: |
          # Run buildozer — it will download SDK and prompt for licenses
          # Pipe yes to accept all license prompts
          yes | buildozer android debug 2>&1 | tee /tmp/build.log
          exit_code=${PIPESTATUS[0]}

          # If it failed because of missing licenses, accept them and retry
          if [ $exit_code -ne 0 ]; then
            SDK="$HOME/.buildozer/android/platform/android-sdk"
            # Accept all licenses
            yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" --licenses 2>/dev/null || true
            # Also install build-tools explicitly
            yes | "$SDK/tools/bin/sdkmanager" --sdk_root="$SDK" "build-tools;37.0.0" 2>/dev/null || true
            # Retry the build
            buildozer android debug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arkanoid-roguelite-android
          path: bin/*.apk
