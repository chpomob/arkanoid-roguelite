name: Build Android APK

on:
  push:
    branches: [feat/android-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless zip unzip

      - name: Install buildozer
        run: pip install buildozer cython

      - name: Build APK (first pass — downloads SDK/NDK)
        continue-on-error: true
        run: buildozer android debug || true

      - name: Accept Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK/tools/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses
          fi

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arkanoid-roguelite-android
          path: bin/*.apk
