name: Deploy to GitHub Pages

on:
  push:
    branches: [feat/android-port]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pygbag
        run: pip install --break-system-packages pygbag

      - name: Build WebAssembly
        run: pygbag --build --can_close 1 src/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: src/build/web

      - name: Deploy
        uses: actions/deploy-pages@v4
