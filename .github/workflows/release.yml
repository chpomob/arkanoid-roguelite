name: Build Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build single-file exe
        run: >
          pyinstaller
          --onefile
          --noconsole
          --name arkanoid-roguelite
          --add-data "src;src"
          --noconfirm
          src/main.py

      - name: Smoke-test the binary
        shell: pwsh
        run: |
          $exe = "dist/arkanoid-roguelite.exe"
          if (-not (Test-Path $exe)) { throw "exe not produced" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Built arkanoid-roguelite.exe ($([math]::Round($size,1)) MB)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: arkanoid-roguelite-windows
          path: dist/arkanoid-roguelite.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arkanoid-roguelite.exe
          generate_release_notes: true
