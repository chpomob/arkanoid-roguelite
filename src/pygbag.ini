[app]
name = Arkanoid Roguelite
package = src
icon = 
version = 1.0.0
description = Arkanoid Roguelite - Pixel Edition

[build]
# Disable optimisation (keep asserts, docstrings) for easier debugging
optimize_level = 0

# Only bundle .py and .ogg files for WASM (no .wav — they're desktop-only)
include_patterns = *.py,*.ogg
